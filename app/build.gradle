apply plugin: 'com.android.application'

// Release signing: keystore.properties in the project root locally (storeFile, keyAlias,
// storePassword), or REDUX_KEYSTORE_FILE / REDUX_KEY_PASSWORD in CI. Without either, release
// builds are signed with the debug key.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def releaseStore = signingProps.getProperty('storeFile') ?: System.getenv('REDUX_KEYSTORE_FILE')
def releasePassword = signingProps.getProperty('storePassword') ?: System.getenv('REDUX_KEY_PASSWORD')

android {
    namespace 'com.shiggsy365.bingetvredux'
    compileSdk 36

    defaultConfig {
        applicationId "com.shiggsy365.bingetvredux"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 8
        versionName "1.0.6"
    }

    signingConfigs {
        if (releaseStore && releasePassword) {
            release {
                storeFile file(releaseStore)
                storePassword releasePassword
                keyAlias signingProps.getProperty('keyAlias') ?: 'bingetvredux'
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        release {
            // Unused library code and resources go (about half the APK).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    // An APK per ABI (FFmpeg's libraries are most of the size), and one with both for anyone
    // unsure which their device needs. The updater picks the device's own.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    // Fire TV and Android TV devices are ARM: no x86 FFmpeg in the universal APK.
    packagingOptions {
        jniLibs {
            excludes += ['lib/x86/**', 'lib/x86_64/**']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    // Radio and podcasts: the remote's play/pause and skip keys work on any screen.
    implementation 'androidx.media3:media3-session:1.11.1'
    // FFmpeg audio decoders (DTS, TrueHD and others the device can't decode itself).
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.16.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Installs src/main/baseline-prof.txt, so start-up code is compiled ahead of time.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub in local unit tests.
    testImplementation 'org.json:json:20240303'
}
